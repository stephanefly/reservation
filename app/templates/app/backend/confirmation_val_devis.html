{% extends 'app/backend/base.html' %}
{% block title %}Valider le devis{% endblock title %}

{% block content %}
<div class="backend-page">
    <header class="backend-page-header">
        <div>
            <p class="backend-page-header__eyebrow">Validation</p>
            <h1>Valider le devis</h1>
            <p class="backend-page-header__description">Finalisez l'acompte et la validation pour <strong>{{ event.client.nom }}</strong>.</p>
        </div>
    </header>
    <section class="backend-card backend-card--narrow">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="backend-actions">
                <button type="submit" class="backend-button backend-button--success"><i class="fas fa-check"></i> Valider le devis</button>
                <a href="{% url 'info_event' event.id %}" class="backend-button backend-button--secondary">Annuler</a>
            </div>
        </form>
    </section>
</div>
{% endblock content %}
