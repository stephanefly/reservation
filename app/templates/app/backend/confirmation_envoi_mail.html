{% extends 'app/backend/base.html' %}
{% block title %}Envoyer le devis{% endblock title %}
{% block content %}
<section class="backend-card backend-confirmation">
    <span class="backend-confirmation__icon"><i class="fas fa-paper-plane"></i></span>
    <h1>Envoyer le devis ?</h1>
    <p>Le devis de <strong>{{ event.client.nom }}</strong> sera envoyé à l'adresse enregistrée.</p>
    <div class="backend-actions">
        <form action="{% url 'envoi_mail_devis' event.id %}" method="post">{% csrf_token %}<button class="backend-button backend-button--primary" type="submit">Confirmer l'envoi</button></form>
        <a class="backend-button backend-button--secondary" href="{% url 'info_event' event.id %}">Annuler</a>
    </div>
</section>
{% endblock content %}
