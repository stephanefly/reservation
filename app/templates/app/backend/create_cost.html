{% extends 'app/backend/base.html' %}
{% block title %}Ajouter un coût{% endblock title %}

{% block content %}
<div class="backend-page">
    <header class="backend-page-header">
        <div>
            <p class="backend-page-header__eyebrow">Finance</p>
            <h1>Ajouter un coût</h1>
            <p class="backend-page-header__description">Enregistrez une dépense dans une catégorie existante ou créez-en une nouvelle.</p>
        </div>
    </header>
    <section class="backend-card backend-card--narrow">
        <form method="post">
            {% csrf_token %}
            <div class="backend-field">
                <label for="name_cost">Catégorie existante</label>
                <select id="name_cost" name="name_cost">
                    <option value="" selected>Choisir une catégorie</option>
                    {% for name_cost in name_costs %}<option value="{{ name_cost.id }}">{{ name_cost.name }}</option>{% endfor %}
                </select>
            </div>
            <div class="backend-field">
                <label for="new_name_cost">Ou nouvelle catégorie</label>
                <input type="text" id="new_name_cost" name="new_name_cost" placeholder="Nom de la nouvelle catégorie">
            </div>
            {{ form.as_p }}
            <div class="backend-actions">
                <button type="submit" class="backend-button backend-button--success"><i class="fas fa-check"></i> Enregistrer</button>
                <a href="{% url 'lst_cost' %}" class="backend-button backend-button--secondary">Annuler</a>
            </div>
        </form>
    </section>
</div>
{% endblock content %}
