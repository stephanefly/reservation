{% extends 'app/backend/base.html' %}
{% block title %}Supprimer l'événement{% endblock title %}
{% block content %}
<section class="backend-card backend-confirmation">
    <span class="backend-confirmation__icon backend-confirmation__icon--danger"><i class="fas fa-trash-alt"></i></span>
    <h1>Supprimer cet événement ?</h1>
    <p>L'événement de <strong>{{ event.client.nom }}</strong> sera supprimé. Cette action est irréversible.</p>
    <div class="backend-actions">
        <form action="{% url 'del_devis' event.id %}" method="post">{% csrf_token %}<button class="backend-button backend-button--danger" type="submit">Confirmer la suppression</button></form>
        <a class="backend-button backend-button--secondary" href="{% url 'info_event' event.id %}">Annuler</a>
    </div>
</section>
{% endblock content %}
