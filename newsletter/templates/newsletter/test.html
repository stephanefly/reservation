{% extends 'newsletter/base.html' %}
{% load bootstrap5 %}
{% block newsletter %}
<h2>Envoyer un email de test</h2>
<p>Destinataire unique <strong>{{ recipient }}</strong></p>
{% if notice %}<p class="alert alert-success" role="status">{{ notice }}</p>{% endif %}
{% if error %}<p class="alert alert-danger" role="alert">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  {% bootstrap_form form %}
  <button class="btn btn-primary" type="submit"><i class="fas fa-paper-plane" aria-hidden="true"></i> Envoyer le test</button>
</form>
{% endblock %}
